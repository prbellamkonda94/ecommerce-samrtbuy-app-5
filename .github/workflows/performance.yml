name: Performance (k6)

# Deliberately not on push/pull_request -- load tests are slower and noisier
# than the build/e2e/security gates, so they run on demand instead of
# blocking merges. Trigger from the Actions tab (Run workflow) or via
# `gh workflow run performance.yml`.
on:
  workflow_dispatch:
    inputs:
      concurrent_users:
        description: 'Concurrent users'
        default: '10'
      tps_target:
        description: 'Target transactions/sec'
        default: '20'
      peak_load:
        description: 'Peak load (concurrent users at peak)'
        default: '40'
      latency_p95_ms:
        description: 'p95 latency budget (ms)'
        default: '500'
      tat_p95_ms:
        description: 'p95 turnaround time budget (ms)'
        default: '2000'

jobs:
  performance:
    name: k6 load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install root deps
        run: npm ci
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: Write test env file
        run: echo "TEST_DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" > k6/.env.k6
      - name: Run k6 load test suite
        working-directory: k6
        env:
          CONCURRENT_USERS: ${{ inputs.concurrent_users }}
          TPS_TARGET: ${{ inputs.tps_target }}
          PEAK_LOAD: ${{ inputs.peak_load }}
          LATENCY_P95_MS: ${{ inputs.latency_p95_ms }}
          TAT_P95_MS: ${{ inputs.tat_p95_ms }}
        run: npm run load
      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-reports
          path: k6/reports/
          retention-days: 30
