name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Write test env files
        run: |
          {
            echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder_do_not_use"
            echo "PORT=3001"
          } > .env
          echo "TEST_DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" > e2e/.env.test
      - name: Run Playwright suite (headed, via Xvfb)
        working-directory: e2e
        run: xvfb-run --auto-servernum -- npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  security:
    name: Security (SAST + DAST)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install root deps
        run: npm ci
      - name: Install e2e deps (audited by the security suite too)
        working-directory: e2e
        run: npm ci
      - name: Install security suite deps
        working-directory: security
        run: npm ci
      - name: Install semgrep
        run: pip install semgrep
      - name: Write test env files
        run: |
          {
            echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder_do_not_use"
            echo "PORT=3001"
          } > .env
          echo "TEST_DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" > security/.env.test
      - name: Run security scan (SAST + DAST)
        working-directory: security
        run: npm run scan
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: |
            security/security-report.md
            security/security-report.json
          retention-days: 30
